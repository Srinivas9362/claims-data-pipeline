name: Claims Pipeline Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891612550035:role/GitHubActions-ClaimsPipeline-Deploy
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Test S3 access
        run: |
          aws s3 ls

      - name: Check EC2 Airflow containers
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-081f6a4b2ef2e8ac6 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ec2-user -H bash -c '\''cd /home/ec2-user/claims-data-pipeline && echo \"===== DOCKER COMPOSE STATUS =====\" && docker compose ps -a && echo \"===== AIRFLOW INIT LOGS =====\" && docker compose logs airflow-init --tail=100 && echo \"===== SCHEDULER LOGS =====\" && docker compose logs airflow-scheduler --tail=50'\''"]' \
            --region us-east-1 \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-081f6a4b2ef2e8ac6 \
              --region us-east-1 \
              --query 'Status' \
              --output text)

            echo "Attempt $i - Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then
              echo "Diagnostic command failed with status: $STATUS"
              break
            fi

            sleep 10
          done

          echo "===== FINAL RESULT ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-081f6a4b2ef2e8ac6 \
            --region us-east-1

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
