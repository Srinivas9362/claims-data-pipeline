name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-auth-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891612550035:role/GitHubActions-ClaimsPipeline-Deploy
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Test S3 access
        run: |
          aws s3 ls

      - name: Check EC2 deployment environment
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-081f6a4b2ef2e8ac6 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd ~/claims-data-pipeline && pwd","git status","docker compose ps"]' \
            --region us-east-1 \
            --query 'Command.CommandId' \
            --output text)
      
          echo "Command ID: $COMMAND_ID"
      
          sleep 10
      
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-081f6a4b2ef2e8ac6 \
            --region us-east-1
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}'
